<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geitenshop NR1 – Inloggen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="index.html" class="logo">
    <div class="planet"></div>
    <div>GEITENSHOP<small>KOLONIE NR1</small></div>
  </a>
  <nav>
    <a href="index.html">Producten</a>
    <a href="winkelwagen.html">Winkelwagen <span class="cart-badge">0</span></a>
    <a href="login.html" class="active">Inloggen</a>
  </nav>
</header>

<main>
  <div class="auth-wrap">
    <div class="panel">
      <h1>Welkom terug, kolonist</h1>
      <p class="subtitle">Log in om je bestellingen en tegoed te bekijken.</p>

      <!-- Foutmelding: tonen vanuit PHP als inloggen mislukt -->
      <!-- <div class="alert error">Onjuiste gebruikersnaam of wachtwoord.</div> -->

      <form action="login.html" method="post">
        <div class="field">
          <label for="gebruikersnaam">Gebruikersnaam</label>
          <input type="text" id="gebruikersnaam" name="gebruikersnaam" placeholder="kolonist123" required>
        </div>
        <div class="field">
          <label for="wachtwoord">Wachtwoord</label>
          <input type="password" id="wachtwoord" name="wachtwoord" placeholder="••••••••" required>
        </div>
        <label style="display:flex; align-items:center; gap:8px; margin-bottom:20px;">
          <input type="checkbox" name="onthouden" style="width:auto;"> Ingelogd blijven
        </label>
        <button type="submit" class="btn full">Inloggen</button>
      </form>

      <div class="auth-links">
        <a href="#">Wachtwoord vergeten?</a>
        <a href="#">Account aanmaken</a>
      </div>

      <div class="divider">— Medewerker van De Geiten? —</div>
      <a href="admin.html" class="btn ghost full">Naar beheeromgeving</a>
    </div>
  </div>
</main>

<footer>© 2026 De Geiten – Geitenshop, kolonie NR1.</footer>

<script src="cart.js"></script>
</body>
</html>
